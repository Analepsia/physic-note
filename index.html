<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理手记 · 教师备课本</title><style data-asset="styles.css">:root{--paper:#f7f7f2;

.block[data-type=flow],.block[data-type=formula],.block[data-type=questions],.block[data-type=steps]{grid-column:1/-1}

margin-bottom:8px}
.question p{font-size:12px;

.editing-banner{font-size:12px;

margin-bottom:16px}
.lecture{display:block;
max-width:860px;
margin:auto;
border-left:1px solid #d3ddc8;
padding-left:30px}
.lecture .block{position:relative;
margin:0 0 24px;
padding:15px 19px;
background:#fffef9;
border:1px solid var(--line);

.lecture .question-text{min-height:0}
.lecture .diagram-wrap svg{max-height:240px}
.library-nav{display:flex;
gap:8px;
overflow:auto;

padding-bottom:7px}
.library-nav button{white-space:nowrap;
background:#edf0e6;
border:1px solid var(--line)}

color:#fff}
.library{display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));

.library .block{grid-column:auto;
border:1px solid var(--line);
border-radius:8px;
padding:12px 16px;
background:#fffef9}
.library .block[data-type=questions]{grid-column:1/-1}
.library .formula-grid,.library .steps,.library .flow{display:flex;
flex-direction:column;
align-items:stretch}
.library .flow b{display:none}
.library .formula{margin-bottom:4px}
.empty{padding:36px;
text-align:center;
color:var(--muted);
grid-column:1/-1}
.image-content{max-width:100%;
max-height:280px;
object-fit:contain;
display:block;
margin:auto;
cursor:zoom-in}
.image-missing{background:#eeeee5;
padding:25px;
text-align:center;
font-size:13px;
color:var(--muted)}
.plain-text{white-space:pre-line;
font-size:13px}
.add-bottom{width:100%;
border:1px dashed #b9c8ad;
margin-top:24px;
color:var(--green)}
dialog{color:var(--ink);
border:1px solid var(--line);
border-radius:14px;
padding:25px;
width:min(620px,calc(100vw - 28px));
max-height:90dvh;
overflow:auto;

align-items:center;
margin-bottom:18px}

grid-template-columns:repeat(3,1fr);
gap:10px}
.add-grid button{background:#fffef9;

color:var(--green);
font-size:24px;
margin-bottom:4px}
.form-row{margin:13px 0}
.form-row label{display:block;
font-size:13px;
margin-bottom:5px}
.form-actions{display:flex;
justify-content:flex-end;
gap:10px;
margin-top:21px}
.preview-image{max-width:100%;
max-height:230px;
display:block;
margin:12px auto}
.upload{display:block;
border:1px dashed #a3b292;
border-radius:8px;
padding:19px;
text-align:center;
background:#edf1e7}
.upload input{margin-top:10px}
.drawer{margin:0 0 0 auto;
height:100dvh;
max-height:100dvh;
border-radius:14px 0 0 14px;
width:min(650px,100vw);

.board-sheet{margin-top:20px;
background:#fffef9;
border:1px solid var(--line);
border-radius:8px;
padding:23px}
.board-sheet h3{font:24px 'SimSun',serif;
margin-bottom:20px}
.board-line{padding:13px 0;
border-bottom:1px solid #dfe5d7;
font-size:17px;
white-space:pre-line}
.board-line b{font-size:13px;
display:block;
color:#798c6c}
.chalk{background:#25473f;
color:#f0efdc;
border:8px solid #9e8a64;

.chalk .board-line{border-color:#ffffff24;
font-family:'KaiTi','SimSun',serif;
font-size:21px}
.chalk .board-line b{color:#d8d49c}
.board-question{margin-top:15px;
padding:12px;
border:1px dashed #829580;
font-size:13px;
white-space:pre-line}
.zoom{width:min(1100px,95vw)}
.zoom img{width:100%;
max-height:75vh;
object-fit:contain}
.search-result{width:100%;
text-align:left;
border-bottom:1px solid var(--line);
border-radius:0;
padding:14px 6px}
.search-result small{display:block}
.directory{padding:30px 0}
.directory button{display:block;
min-width:250px;
text-align:left;
border:1px solid var(--line);
margin-top:12px;
background:#fffef9}
#toast{position:fixed;
bottom:26px;
left:50%;
transform:translateX(-50%);

border-radius:8px;
background:#284b3f;

font-size:13px;
max-width:90%;

pointer-events:none}

.storage-warning{color:#9c5b26}

@keyframes slide{from{transform:translateX(100%)}
to{transform:translateX(0)}
}
@media(min-width:1400px){.page{padding:32px 48px}
.question p,.bullets li,.flow span{font-size:14px}
}
@media(max-width:1050px){.shell{grid-template-columns:210px minmax(0,1fr)}

.top-actions button{padding:8px 10px}

@media(max-width:900px){.shell{grid-template-columns:0 minmax(0,1fr)}

.page{padding:20px}
.topbar-left .muted{display:none}

.heading .muted{display:none}

align-items:center;
justify-content:space-between}

}

:root{scrollbar-gutter:stable}

.page{padding-top:18px}

.breadcrumb{margin-bottom:8px}

.template-bar{margin-top:17px;
margin-bottom:16px}

.tags{margin-top:8px}

.diagram-wrap svg{max-height:150px}

.question-filters button,.tabs button{min-height:44px}

:root{--diagram-force:#326656;--diagram-gravity:#a86635;--diagram-component:#657b3d;--diagram-muted:#97a391;--diagram-plane:#eff2e7;--diagram-block:#c9d8b6}
.shell{transition:grid-template-columns .28s ease}
aside.tree{min-width:0;transition:opacity .22s ease,transform .28s ease,visibility .28s;transform:translateX(0);opacity:1}
.closed aside.tree{padding:27px 16px;opacity:0;transform:translateX(-100%);pointer-events:none}
.tree .brand{margin-bottom:24px}
.tree-caption{letter-spacing:1px;margin-bottom:5px}
.tree-hide{font-size:12px;letter-spacing:0;border:1px solid #d3dbcb;background:#f8faf4;padding:7px 10px}
.tree-locate{width:100%;text-align:left;font-size:12px;color:var(--green);border:1px dashed #c3cfb9;background:#f3f6ee;margin:5px 0 15px}
.tree-navigation{padding:0 0 5px}
.tree-row{margin:4px 0;padding-left:calc(var(--depth)*7px);min-height:46px;border:1px solid transparent;transition:background .18s,border-color .18s,box-shadow .18s}
.tree-row.active{background:#dbe7d5;border-color:#bdcdb2;box-shadow:inset 3px 0 0 var(--green)}
.tree-row .branch{width:40px;min-height:44px;border-radius:7px;display:grid;place-items:center}
.tree-row .branch:hover{background:#d7e1cd}
.branch-chevron{display:block;font:24px/1 Georgia;transition:transform .24s ease}
.branch[aria-expanded=true] .branch-chevron{transform:rotate(90deg)}
.tree-leaf{display:grid;place-items:center;width:40px;flex-shrink:0;color:#839975;font-size:15px}
.tree-row .node{min-width:0;white-space:normal;display:flex;gap:6px;align-items:center;justify-content:space-between;line-height:1.45;padding:9px 7px 9px 0;border-radius:5px;font-size:13px}
.node-current{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.tree-row button:active,.tree-locate:active,.tree-hide:active{transform:scale(.96);background:#cfddc5}
.tree-children{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .26s ease,opacity .2s ease,visibility .26s}
.tree-children.is-open{grid-template-rows:1fr;opacity:1;visibility:visible}
.tree-children-inner{overflow:hidden;min-height:0}
.tree-children .tree-children-inner{border-left:1px solid #d3ddcb;margin-left:9px}
.block#block-essentials{grid-column:1/-1}
.mastery-list{display:grid;grid-template-columns:1fr 1fr;gap:18px 25px}
.mastery-item{display:flex;gap:11px;align-items:flex-start;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.mastery-number{font:italic 19px/30px Georgia;color:#81976e;width:24px;flex-shrink:0}
.mastery-item h3{font-size:15px;margin:2px 0 8px}
.mastery-item p{font-size:13px;line-height:1.9;color:#526052}
.mastery-item .mastery-check{background:#edf1e5;border-radius:5px;margin-top:10px;padding:8px 10px;color:#48633d;font-size:12px}
.lecture .mastery-list,.library .mastery-list{grid-template-columns:1fr}
.board-drawer{width:min(890px,94vw);padding:23px 27px}
.board-drawer.board-wide{width:min(1120px,100vw)}
.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.copy-sheet{padding:25px;background:#fffef9}
.copy-heading{border-bottom:2px solid #abbc98;padding-bottom:18px;margin-bottom:5px}
.copy-heading>span{font-size:11px;letter-spacing:2px;color:#82906f}
.copy-heading h3{margin:8px 0 10px;font-size:26px;line-height:1.5}
.copy-heading p{font-size:13px;line-height:1.85;color:#65735b}
.board-panel{padding:18px 0;border-bottom:1px solid #d7dfcc;break-inside:avoid}
.board-panel h4{font-size:16px;margin:0 0 14px;display:flex;gap:12px;align-items:center}
.board-panel h4>span{font:italic 18px Georgia;color:#889d72}
.board-pair{display:grid;grid-template-columns:minmax(210px,.95fr) minmax(0,1.05fr);align-items:center;gap:22px}
.board-pair figure{margin:0;min-width:0}
.board-diagram{width:100%;display:block;font:19px Georgia,'Times New Roman',serif}
.board-diagram .diagram-small{font:12px 'Microsoft YaHei',sans-serif;fill:var(--diagram-muted)}
.board-pair figcaption{font-size:11px;line-height:1.7;color:#7b896c;padding:4px 7px}
.board-equations{border-left:1px solid #dce3d1;padding-left:21px;min-width:0}
.board-equation{margin:0 0 14px}
.board-equation:last-child{margin-bottom:0}
.board-equation>span{display:block;font-size:12px;color:#758568;margin-bottom:3px}
.board-equation>div{font:21px/1.65 Georgia,'Times New Roman',serif;overflow-wrap:anywhere}
.board-reminder{font-size:12px;background:#f1f3e9;border-left:2px solid #b3c499;padding:8px 11px;margin-top:13px;line-height:1.8}
.copy-sheet .board-line{font-size:14px;line-height:1.8}

    card.id='incline'; card.title=legacy.nodes?.find(n=>n.id==='incline')?.title || '斜面问题';
    const boards=(legacy.blocks||[]).filter(b=>b.type==='board');
    const panels=boards.flatMap(b=>b.panels||[]);
    // More than three legacy panels are split across cards, never discarded.
    const cards=[];
    for(let offset=0; offset<Math.max(panels.length,1); offset+=3) {
      const c=structuredClone(card); if(offset){c.id=uid();c.title+=' · 板书续页 '+(offset/3+1);}
      c.board={mainline:'',title:'固定斜面上的下滑物块',conditions:'斜面固定，物块已在下滑且不脱离斜面；仅受重力、支持力和滑动摩擦力。μ 为动摩擦因数。',note:offset?'':boards.map(b=>b.text||'').join('\n'),columns:panels.slice(offset,offset+3).map(p=>({...column(),title:p.title||'',scene:p.scene||'',caption:p.caption||'',content:(p.formulas||[]).map(([a,b])=>a+' | '+b).join('\n'),note:p.note||''}))};
      c.board.mainline='真实受力 → 重力分解 → 运动方程';
      if(!c.board.columns.length)c.board.columns=[column()];
      cards.push(c);
    }
    return {schemaVersion:3,notebookId:'physics-notebook',cards,trash:[]};
  }
  function validate(data) {
    const fail = msg => {throw new Error('数据格式不正确：'+msg);};
    const obj = (v,name) => {if(!v||typeof v!=='object'||Array.isArray(v))fail(name);};
    const str = (v,name,max=100000) => {if(typeof v!=='string'||v.length>max)fail(name);};
    const list = (v,name,max=10000) => {if(!Array.isArray(v)||v.length>max)fail(name);};
    const strings = (v,name,max) => {list(v,name,max);v.forEach(x=>str(x,name));};
    const ids = new Set();
    const id = (v,name) => {str(v,name,200);if(!/^[A-Za-z0-9_-]+$/.test(v)||ids.has(v))fail(name+'格式错误或重复');ids.add(v);};
    function images(xs) {list(xs,'图片',30);xs.forEach(im=>{obj(im,'图片');str(im.id,'图片编号',200);str(im.name,'图片名称',500);str(im.src,'图片内容',30000000);if(!/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(im.src))fail('图片仅支持 PNG、JPEG、WebP、GIF 内嵌数据');});}
    function card(c){
      obj(c,'卡片');id(c.id,'卡片编号');str(c.title,'标题',500);strings(c.path,'目录',12);str(c.essence,'一句话本质');strings(c.mustKnow,'必须掌握',3);strings(c.pitfalls,'易错与提问',100);
      obj(c.board,'板书');['mainline','title','conditions','note'].forEach(k=>str(c.board[k],k));list(c.board.columns,'板书栏',3);if(!c.board.columns.length)fail('至少保留一栏板书');
      c.board.columns.forEach(p=>{obj(p,'板书栏');id(p.id,'板书栏编号');['title','content','caption','note','scene'].forEach(k=>str(p[k],k));if(!['','forces','components','equations'].includes(p.scene))fail('示意图类型');images(p.images);});
      list(c.examples,'例题',1000);c.examples.forEach(q=>{obj(q,'例题');id(q.id,'例题编号');if(!['基础','典型','变式'].includes(q.level))fail('例题分类');['title','prompt','steps','answer'].forEach(k=>str(q[k],k));images(q.images);});
    }
    obj(data,'备课本');if(data.schemaVersion!==3)fail('请导入本工具导出的第 3 版 JSON');str(data.notebookId,'备课本编号',200);if(!data.notebookId)fail('备课本编号');list(data.cards,'卡片',2000);list(data.trash,'回收站',2000);data.cards.forEach(card);data.trash.forEach(card);
    return structuredClone(data);
  }
  return {uid,column,blank,example,migrate,validate};
})();

  let db, key, lastStamp=0, tail=Promise.resolve();

  function open(){return new Promise((resolve,reject)=>{const r=indexedDB.open('physics-teacher-notebook',1);r.onupgradeneeded=()=>r.result.createObjectStore('notebooks');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('浏览器存储被占用'));});}
  function read(){return new Promise((resolve,reject)=>{const r=db.transaction('notebooks').objectStore('notebooks').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
  function write(record){return new Promise((resolve,reject)=>{const tx=db.transaction('notebooks','readwrite');tx.objectStore('notebooks').put(record,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('保存中断'));});}
  async function load(seed){
    key='physics-teacher-v3:'+seed.notebookId;
    let stored,recovery,warning='';
    try{db=await open();stored=await read();}catch{warning='浏览器数据库不可用，将尝试本地备用保存。';}
    let rawRecovery;
    try{rawRecovery=localStorage.getItem(journal());}catch{warning='浏览器备用保存不可用。';}
    try{recovery=JSON.parse(rawRecovery||'null');}catch{throw new Error('本地恢复记录无法读取；原记录未覆盖。请使用 JSON 备份恢复。');}
    const candidates=[stored,recovery].filter(Boolean).sort((a,b)=>b.stamp-a.stamp);
    if(candidates.length){
      for(const r of candidates){try{const state=CardModel.validate(r.state);lastStamp=r.stamp;return {state,warning};}catch{warning='部分保存记录损坏，已尝试读取可用副本。';}}
      throw new Error('已有保存记录无法读取。请保留浏览器数据并使用 JSON 备份恢复，避免覆盖原内容。');
    }
    if(!document.getElementById('notebook-data')){
      try{const old=JSON.parse(localStorage.getItem('physics-workbench-cards-v2')||localStorage.getItem('physics-workbench-v1')||'null');if(old?.blocks&&old?.nodes)return {state:CardModel.validate(CardModel.migrate(old)),warning};}catch{warning='旧版记录未能转换，原记录已保留。';}
    }
    return {state:CardModel.validate(seed),warning};
  }
  function save(state){
    const record={stamp:Math.max(Date.now(),lastStamp+1),state:structuredClone(state)};lastStamp=record.stamp;
    let recovered=false;
    try{localStorage.setItem(journal(),JSON.stringify(record));recovered=true;}catch{}
    const operation=tail.catch(()=>{}).then(async()=>{
      if(db){try{await write(record);try{const current=JSON.parse(localStorage.getItem(journal())||'null');if(current?.stamp===record.stamp)localStorage.removeItem(journal());}catch{}return;}catch(error){if(!recovered)throw error;}}
      if(!recovered)throw new Error('浏览器空间不足或禁止保存。请立即导出 JSON 备份，勿关闭页面。');
    });
    tail=operation;return operation;
  }
  return {load,save,flush:()=>tail};
})();
</script>
<script data-asset="publish.js">/* 单文件发布包：只读取明确列出的网页资源，不包含本地启动脚本或日志。 */
window.PhysicsPublish = {
 async build(state, read = async path => {
  const inline=document.querySelector('[data-asset="'+path+'"]');
  if(inline)return inline.textContent;
  const response=await fetch(path,{cache:'no-store'});
  if(!response.ok)throw new Error('无法读取 '+path+'，请通过本地预览地址打开后导出。');
  return response.text();
 }) {
  const snapshot=CardModel.validate(state);
  const scripts=['card-model.js','data.js','board-diagrams.js','board-view.js','card-workbench.js','card-storage.js','publish.js','app.js'];
  const styles=['styles.css','cards.css'];
  const sources=Object.fromEntries(await Promise.all([...scripts,...styles].map(async name=>[name,await read(name)])));
  const styleHTML=styles.map(name=>`<style data-asset="${name}">${sources[name].replace(/<\/style/gi,'<\\/style')}</style>`).join('\n');
  const scriptHTML=scripts.map(name=>`<script data-asset="${name}">${sources[name].replace(/<\/script/gi,'<\\/script')}<\/script>`).join('\n');
  const data=JSON.stringify(snapshot).replace(/</g,'\\u003c');
  const html=`<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理手记 · 教师备课本</title>${styleHTML}</head><body><div id="app"><p class="loading">正在打开备课本…</p></div><dialog id="modal" aria-label="操作窗口"></dialog><div id="toast" role="status"></div><input id="image-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input id="data-import" type="file" accept=".json,application/json" hidden><script type="application/json" id="notebook-data">${data}<\/script>${scriptHTML}</body></html>`;
  return {html,version:new Date().toISOString(),imageCount:snapshot.cards.reduce((sum,c)=>sum+c.board.columns.reduce((n,p)=>n+p.images.length,0)+c.examples.reduce((n,q)=>n+q.images.length,0),0)};
 },
 zip(html){
  const data=new TextEncoder().encode(html),name=new TextEncoder().encode('index.html');
  let crc=0xffffffff;for(const byte of data){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}crc=(crc^0xffffffff)>>>0;
  const localSize=30+name.length+data.length,centralSize=46+name.length;
  const bytes=new Uint8Array(localSize+centralSize+22),view=new DataView(bytes.buffer);
  const u16=(offset,value)=>view.setUint16(offset,value,true),u32=(offset,value)=>view.setUint32(offset,value,true);
  u32(0,0x04034b50);u16(4,20);u16(12,33);u32(14,crc);u32(18,data.length);u32(22,data.length);u16(26,name.length);bytes.set(name,30);bytes.set(data,30+name.length);
  const c=localSize;u32(c,0x02014b50);u16(c+4,20);u16(c+6,20);u16(c+14,33);u32(c+16,crc);u32(c+20,data.length);u32(c+24,data.length);u16(c+28,name.length);bytes.set(name,c+46);
  const e=c+centralSize;u32(e,0x06054b50);u16(e+8,1);u16(e+10,1);u32(e+12,centralSize);u32(e+16,localSize);return bytes;
 },
 downloadFile(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);},
 async download(state){const result=await this.build(state);this.downloadFile(this.zip(result.html),'物理手记-网站发布包.zip','application/zip');}
};
</script>

    document.title=(c?.title||'物理手记')+' · 教师备课本';
  }
  function show(title,html,wide=false){lastFocus=document.activeElement;modal.className=wide?'notebook-dialog wide-dialog':'notebook-dialog';modal.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2>${button('close','×','aria-label="关闭窗口"')}</div>${html}`;if(!modal.open)modal.showModal();}

  function remember(restore){undoState=restore;}

  function targetRecord(target,card=selected()){const [kind,n]=target.split(':');return kind==='board'?card?.board.columns[Number(n)]:card?.examples[Number(n)];}
  function downloadJSON(data,name){PhysicsPublish.downloadFile(JSON.stringify(data,null,2),name,'application/json');}
  function exportData(){downloadJSON(state,'物理手记-全部数据-'+new Date().toISOString().slice(0,10)+'.json');toast('已导出全部卡片、图片及回收站');}
  function openTrash(){show('回收站',`<p class="dialog-help">删除的卡片保存在这里，可以恢复。</p>${state.trash.map(c=>`<div class="trash-row"><span>${esc(c.title)}</span>${button('restore','恢复',`data-id="${esc(c.id)}"`,'outline')}</div>`).join('')||'<p class="muted">回收站是空的。</p>'}`);}
  async function action(event){

      case 'trash':openTrash();break;
      case 'restore':{const card=state.trash.find(x=>x.id===id);if(card){state.trash=state.trash.filter(x=>x.id!==id);state.cards.push(card);current=id;save();close();render();toast('已恢复卡片');}break;}

      case 'example-delete':confirm('删除例题','删除这道题及其图片？本次操作可以撤销。',()=>{const removed=c.examples.splice(i,1)[0];remember(()=>{c.examples.splice(i,0,removed);return true;});changed();offerUndo();});break;
      case 'example-up':case 'example-down':case 'column-up':case 'column-down':{const list=a.startsWith('column')?c.board.columns:c.examples,j=i+(a.endsWith('up')?-1:1);if(j>=0&&j<list.length){[list[i],list[j]]=[list[j],list[i]];changed();}break;}

  function offerUndo(){document.querySelector('#undo-bar')?.remove();const el=document.createElement('div');el.id='undo-bar';el.innerHTML='内容已删除 '+button('undo','撤销删除','','outline');document.body.append(el);}
  function pathParts(value){const xs=value.split(/[/／]/).map(x=>x.trim()).filter(Boolean);if(xs.length>12)throw new Error('目录最多 12 层');return xs;}
  function editField(event){

  }
  app.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;refreshDirectory();}else if(event.target.tagName!=='SELECT')editField(event);});

  document.addEventListener('click',event=>{action(event).catch(error=>toast(error.message));});

  document.addEventListener('change',async event=>{
    if(!event.target.matches('#data-import,[data-import-source]'))return;
    const file=event.target.files[0];event.target.value='';if(!file)return;
    try{if(file.size>200*1024*1024)throw new Error('文件超过 200 MB，请使用较小的备份。');const incoming=CardModel.validate(JSON.parse(await file.text()));confirm('导入备课数据',`文件包含 ${incoming.cards.length} 张卡片。导入将替换当前备课本；替换前会自动下载当前数据备份。`,async()=>{downloadJSON(state,'物理手记-导入前备份-'+Date.now()+'.json');incoming.notebookId=state.notebookId;state=incoming;current=state.cards[0]?.id;query='';edit=false;invalid=false;undoState=null;document.querySelector('#undo-bar')?.remove();await save();render();toast('已导入 '+state.cards.length+' 张卡片');},'备份并导入');}catch(error){show('未导入数据',`<p>${esc(error.message)}</p><p class="dialog-help">当前内容没有改变，请选择本工具导出的完整 JSON 文件。</p>`);}
  });
  window.addEventListener('beforeunload',event=>{if(pending||invalid||saveState.includes('失败')){event.preventDefault();event.returnValue='';}});
  try{
    const embedded=document.getElementById('notebook-data');const seed=embedded?JSON.parse(embedded.textContent):window.PHYSICS_SEED;
    const loaded=await CardStorage.load(seed);state=loaded.state;current=state.cards[0]?.id;render();if(loaded.warning)toast(loaded.warning);await save();
  }catch(error){state={schemaVersion:3,notebookId:window.PHYSICS_SEED.notebookId,cards:[],trash:[]};try{const embedded=document.getElementById('notebook-data');if(embedded)state.notebookId=JSON.parse(embedded.textContent).notebookId;}catch{}app.innerHTML=`<div class="startup-error"><h1>备课本暂未打开</h1><p>${esc(error.message)}</p><p>原存储记录未覆盖。请保留浏览器数据，或选择之前导出的 JSON 备份恢复。</p>${button('import','从 JSON 备份恢复','','primary')}</div>`;}
})();
